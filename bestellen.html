<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="robots" content="noindex">
  <title>Bestellung öffnen · Eiscafé Delfino</title>
  <meta http-equiv="refresh" content="0;url=https://eiscafe-delfino.de/bestellen/">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4efe6;color:#1d1b18}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px}
    .card{width:min(680px,100%);text-align:center;background:#fbf8f2;border:1px solid rgba(29,27,24,.14);border-radius:28px;padding:48px 28px;box-shadow:0 24px 80px rgba(40,30,20,.10)}
    .mark{width:58px;height:58px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;background:#1d1b18;color:#fff;font:italic 36px Georgia,serif}
    h1{font:400 clamp(40px,8vw,66px)/.98 Georgia,"Times New Roman",serif;letter-spacing:-.04em;margin:0 0 16px}
    p{color:#766e64;margin:0 auto 28px;max-width:480px;line-height:1.6}
    a{display:inline-flex;min-height:56px;align-items:center;justify-content:center;padding:0 26px;border-radius:999px;background:#c94739;color:white;text-decoration:none;font-weight:800}
  </style>
  <script>window.location.replace('https://eiscafe-delfino.de/bestellen/');</script>
</head>
<body>
  <main class="card">
    <div class="mark">D</div>
    <h1>Bestellsystem wird geöffnet.</h1>
    <p>Falls die Weiterleitung nicht automatisch startet, kannst du das Delfino-Bestellsystem hier direkt öffnen.</p>
    <a href="https://eiscafe-delfino.de/bestellen/">Jetzt online bestellen</a>
  </main>
</body>
</html>
